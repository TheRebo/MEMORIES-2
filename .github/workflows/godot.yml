name: Godot

on:
  push:
    branches-ignore: [main]
    paths: ['godot/**', '.github/workflows/godot.yml']
  pull_request:
    paths: ['godot/**', '.github/workflows/godot.yml']
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GODOT_VERSION: 4.7.2
    defaults:
      run:
        shell: bash
        working-directory: godot
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot
        run: |
          url="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fsSL -o /tmp/godot.zip "$url"
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo mv /tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: Import assets
        run: |
          # The first import can report the theme's fonts as missing (they are imported in the
          # same pass); the second pass must be clean.
          godot --headless --path . --import > import-first.log 2>&1 || true
          godot --headless --path . --import 2>&1 | tee import.log
          ! grep -nE "SCRIPT ERROR|^ERROR:" import.log

      - name: Compile every script
        run: |
          godot --headless --path . --script res://tests/check_scripts.gd 2>&1 | tee scripts.log
          ! grep -nE "SCRIPT ERROR|^ERROR:|BROKEN" scripts.log

      - name: Load every scene
        run: |
          godot --headless --path . --script res://tests/check_scenes.gd 2>&1 | tee scenes.log
          ! grep -nE "SCRIPT ERROR|^ERROR:|BROKEN|CANNOT" scenes.log

      - name: Play through (headless)
        run: |
          timeout 600 godot --headless --path . --script res://tests/smoke.gd 2>&1 | tee smoke.log
          ! grep -nE "SCRIPT ERROR|^ERROR:|FAIL " smoke.log

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-logs
          path: |
            godot/*.log
            godot/**/*.import
