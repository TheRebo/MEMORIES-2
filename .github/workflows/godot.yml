name: Godot

on:
  push:
    branches-ignore: [main]
    paths: ['godot/**', '.github/workflows/godot.yml']
  pull_request:
    paths: ['godot/**', '.github/workflows/godot.yml']
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GODOT_VERSION: 4.7.2
    defaults:
      run:
        shell: bash
        working-directory: godot
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot
        run: |
          url="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fsSL -o /tmp/godot.zip "$url"
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo mv /tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: Import assets
        run: |
          # The first import can report the theme's fonts as missing (they are imported in the
          # same pass); the second pass must be clean.
          godot --headless --path . --import > import-first.log 2>&1 || true
          godot --headless --path . --import 2>&1 | tee import.log
          ! grep -nE "SCRIPT ERROR|^ERROR:" import.log | grep -v "still in use at exit"

      - name: Compile every script
        run: |
          godot --headless --path . --script res://tests/check_scripts.gd 2>&1 | tee scripts.log
          ! grep -nE "SCRIPT ERROR|^ERROR:|BROKEN" scripts.log | grep -v "still in use at exit"

      - name: Load every scene
        run: |
          godot --headless --path . --script res://tests/check_scenes.gd 2>&1 | tee scenes.log
          ! grep -nE "SCRIPT ERROR|^ERROR:|BROKEN|CANNOT" scenes.log | grep -v "still in use at exit"

      - name: Play through (headless)
        run: |
          timeout 600 godot --headless --path . --script res://tests/smoke.gd 2>&1 | tee smoke.log
          ! grep -nE "SCRIPT ERROR|^ERROR:|FAIL " smoke.log | grep -v "still in use at exit"

      - name: Screenshots (xvfb, GL Compatibility)
        if: always()
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb mesa-utils > /dev/null
          timeout 300 xvfb-run -s "-screen 0 1280x720x24" godot --path . --rendering-driver opengl3 \
            --resolution 1280x720 --script res://tests/screenshots.gd > shots.log 2>&1 || true
          grep -E "^SHOT" shots.log || true
          grep -nE "SCRIPT ERROR|^ERROR:" shots.log | grep -v "still in use at exit" | head -40 || true

      - name: Print import settings
        if: always()
        run: |
          # The import files the editor writes next to each asset, printed so they can be
          # committed like a project saved from the editor.
          find assets -name "*.import" | sort | while read -r f; do
            echo "IMPORT-BEGIN $f"; sed 's/^/IMPORT /' "$f"; echo "IMPORT-END $f"
          done

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-logs
          path: |
            godot/*.log
            godot/**/*.import
